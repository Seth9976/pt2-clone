name: Build Windows  
  
on:  
  workflow_dispatch:
  push:  
    branches: [ master ]  
  pull_request:  
    branches: [ master ]  
  
jobs:  
  build-windows:  
    runs-on: windows-latest  
    steps:  
      - uses: actions/checkout@v4  
  
      - uses: msys2/setup-msys2@v2  
        with:  
          msystem: MINGW64  
          update: true  
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-make mingw-w64-x86_64-SDL2  
  
      - name: Configure  
        shell: msys2 {0}  
        run: cmake -S . -B build -G "MinGW Makefiles"  
  
      - name: Build  
        shell: msys2 {0}  
        run: cmake --build build --config Release  
  
      - name: Upload artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: pt2-clone-windows  
          path: release/other/pt2-clone.exe
