name: Build Windows  
  
on:  
  push:  
    branches: [ master ]  
  pull_request:  
    branches: [ master ]  
  workflow_dispatch:  
  
jobs:  
  build-windows:  
    runs-on: windows-latest  
    steps:  
      - uses: actions/checkout@v4  
  
      - uses: msys2/setup-msys2@v2  
        with:  
          msystem: MINGW64  
          update: true  
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-make mingw-w64-x86_64-SDL2  
  
      - name: Configure  
        shell: msys2 {0}  
        run: cmake -S . -B build -G "MinGW Makefiles"  
  
      - name: Build  
        shell: msys2 {0}  
        run: cmake --build build --config Release  
  
      - name: Locate built executable  
        shell: msys2 {0}  
        run: find "$(pwd)" -iname "pt2-clone.exe" -type f -exec echo "BIN_PATH={}" \; >> "$GITHUB_ENV"  
  
      - name: Locate SDL2.dll in MSYS2 toolchain  
        shell: msys2 {0}  
        run: find /mingw64 -iname "SDL2.dll" -type f -exec echo "DLL_PATH={}" \; >> "$GITHUB_ENV"  
  
      - name: Create distribution directory  
        shell: msys2 {0}  
        run: mkdir -p dist  
  
      - name: Copy executable into distribution directory  
        shell: msys2 {0}  
        run: cp "$BIN_PATH" dist/  
  
      - name: Copy SDL2.dll into distribution directory  
        shell: msys2 {0}  
        run: cp "$DLL_PATH" dist/  
  
      - name: Show final distribution directory contents  
        shell: msys2 {0}  
        run: find dist -type f  
  
      - uses: actions/upload-artifact@v4  
        with:  
          name: pt2-clone-windows  
          path: dist
